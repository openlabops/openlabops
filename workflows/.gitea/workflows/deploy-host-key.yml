name: Deploy Generic Host SSH Key Workflow ($hostname.pub)

on:
  workflow_dispatch:
    inputs:
      host_name:
        description: 'Endpoint Host Name (e.g., workstation, laptop, desktop)'
        required: true
        default: 'workstation'
      pub_key:
        description: 'Public Key Content (Optional: if passed, will be saved to secrets)'
        required: false
        default: ''

jobs:
  deploy-host-key:
    runs-on: ansible
    defaults:
      run:
        shell: sh

    steps:
      - name: 檢出工作流倉庫 (Self Checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then apk add --no-cache git; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq git; fi
          fi
          git clone --quiet --depth 1 http://oauth2:${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}@${{ vars.GIT_HOST || 'gitea.lab' }}/${{ vars.ORG_NAME || 'OpenLabOps' }}/openlab-workflows.git .

      - name: 檢出 Secrets 倉庫
        if: ${{ inputs.pub_key != '' }}
        uses: ./.gitea/actions/checkout-federation
        with:
          repos: "openlab-secrets"
          gitea_host: ${{ vars.GIT_HOST || 'gitea.lab' }}
          org_name: ${{ vars.ORG_NAME || 'OpenLabOps' }}
          token: ${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}

      - name: 若由遠端傳入公鑰字串，寫入並提交至 Secrets
        if: ${{ inputs.pub_key != '' }}
        env:
          HOST_NAME: ${{ inputs.host_name }}
          PUB_KEY: ${{ inputs.pub_key }}
        run: |
          if ! echo "$HOST_NAME" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "Error: Invalid host_name '$HOST_NAME'" >&2
            exit 1
          fi
          mkdir -p /tmp/openlab-secrets/ssh-key
          printf '%s\n' "$PUB_KEY" > "/tmp/openlab-secrets/ssh-key/${HOST_NAME}.pub"
          chmod 644 "/tmp/openlab-secrets/ssh-key/${HOST_NAME}.pub"

      - name: 提交傳入之端點公鑰至 Secrets
        if: ${{ inputs.pub_key != '' }}
        uses: ./.gitea/actions/git-sync-commit
        with:
          target_dir: '/tmp/openlab-secrets'
          commit_msg: "feat(ssh): save endpoint ${{ inputs.host_name }}.pub"
          author_name: 'ci-bot'
          author_email: 'ci-bot@lab'

      - name: 執行 Ansible Playbook (Deploy $hostname.pub)
        uses: ./.gitea/actions/execute-homelab-playbook
        with:
          playbook: 'playbooks/deploy-host-key.yml'
          extra_vars: "host_name=${{ inputs.host_name }} host_pub_key_path=/tmp/openlab-secrets/ssh-key/${{ inputs.host_name }}.pub"
          key_name: 'ansible.key'
          gitea_host: ${{ vars.GIT_HOST || 'gitea.lab' }}
          org_name: ${{ vars.ORG_NAME || 'OpenLabOps' }}
          token: ${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}
