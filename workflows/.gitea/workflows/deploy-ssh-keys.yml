name: Deploy Node SSH Keys Workflow

on:
  workflow_dispatch:
    inputs:
      target_hosts:
        description: 'Target Host(s) or Group (e.g., dev, servers, all)'
        required: true
        default: 'dev'
      target_user:
        description: 'Target User Account on Target Host (e.g., labadmin)'
        required: false
        default: 'labadmin'
      deploy_client_keys:
        description: 'Deploy Managed Client Keys into ~/.ssh/ (Strictly restricted to dev nodes)'
        required: false
        default: 'false'
      deploy_authorized_keys:
        description: 'Deploy Public Keys into authorized_keys'
        required: false
        default: 'true'
      deploy_ssh_config:
        description: 'Deploy Standard ~/.ssh/config'
        required: false
        default: 'true'
      source_commit_sha:
        description: 'Historical secrets Git Commit SHA on Target Host (used to unlock node before updating to HEAD)'
        required: false
        default: 'HEAD'

jobs:
  deploy-ssh-keys:
    runs-on: ansible
    defaults:
      run:
        shell: sh

    steps:
      - name: 檢出工作流倉庫 (Self Checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then apk add --no-cache git; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq git; fi
          fi
          git clone --quiet --depth 1 http://oauth2:${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}@${{ vars.GIT_HOST || 'gitea.lab' }}/${{ vars.ORG_NAME || 'OpenLabOps' }}/openlab-workflows.git .

      - name: 執行節點 SSH 金鑰部署劇本
        uses: ./.gitea/actions/execute-federation-playbook
        with:
          playbook: 'playbooks/deploy-node-ssh-keys.yml'
          extra_vars: "target_hosts=${{ inputs.target_hosts }} target_user=${{ inputs.target_user }} client_keys=${{ inputs.deploy_client_keys }} authorized_keys=${{ inputs.deploy_authorized_keys }} ssh_config=${{ inputs.deploy_ssh_config }}"
          source_commit_sha: ${{ inputs.source_commit_sha }}
          need_configs: 'true'
          key_name: 'ansible.key'
          gitea_host: ${{ vars.GIT_HOST || 'gitea.lab' }}
          org_name: ${{ vars.ORG_NAME || 'OpenLabOps' }}
          token: ${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}
