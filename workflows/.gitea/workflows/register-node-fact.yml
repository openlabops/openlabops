name: Register or Remove Node Fact in Federation

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation: upsert or remove'
        required: false
        default: 'upsert'
      hostname:
        description: 'Target node hostname'
        required: true
      node_json_b64:
        description: 'Base64-encoded node JSON fact (required for upsert)'
        required: false
        default: ''

jobs:
  register-node-fact:
    runs-on: ansible
    defaults:
      run:
        shell: sh

    steps:
      - name: 檢出工作流倉庫 (Self Checkout)
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then apk add --no-cache git; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq git; fi
          fi
          git clone --quiet --depth 1 http://oauth2:${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}@${{ vars.GIT_HOST || 'gitea.lab' }}/${{ vars.ORG_NAME || 'OpenLabOps' }}/openlab-workflows.git .

      - name: 準備基礎環境
        uses: ./.gitea/actions/setup-environment
        with:
          packages: "git python3"

      - name: 檢出聯邦節點事實倉庫
        uses: ./.gitea/actions/checkout-federation
        with:
          repos: "openlab-configs openlab-operations"
          gitea_host: ${{ vars.GIT_HOST || 'gitea.lab' }}
          org_name: ${{ vars.ORG_NAME || 'OpenLabOps' }}
          token: ${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}

      - name: 寫入或移除節點事實 JSON
        env:
          OP_ACTION: ${{ inputs.action }}
          OP_HOST: ${{ inputs.hostname }}
          OP_JSON_B64: ${{ inputs.node_json_b64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path

          action = os.environ.get("OP_ACTION", "upsert").strip().lower()
          host = re.sub(r"[^a-zA-Z0-9._-]", "", os.environ.get("OP_HOST", "").strip())
          if not host:
              raise SystemExit("Missing valid hostname")

          cfg_file = Path(f"/tmp/openlab-configs/node-information/node_{host}.json")
          ops_file = Path(f"/tmp/openlab-operations/conf/nodes/{host}.json")

          if action == "remove":
              for f in (cfg_file, ops_file):
                  if f.exists():
                      f.unlink()
          else:
              b64 = os.environ.get("OP_JSON_B64", "").strip()
              if not b64:
                  raise SystemExit("Missing node_json_b64")
              data = json.loads(base64.b64decode(b64).decode("utf-8"))
              formatted = json.dumps(data, indent=2, ensure_ascii=False) + "\n"
              for f in (cfg_file, ops_file):
                  if f.parent.parent.exists():
                      f.parent.mkdir(parents=True, exist_ok=True)
                      f.write_text(formatted, encoding="utf-8")
          PY
          if [ -f "/tmp/openlab-operations/engine/classifier.py" ]; then
            python3 "/tmp/openlab-operations/engine/classifier.py" --apply || true
          fi

      - name: 推送至 Configs 倉庫
        uses: ./.gitea/actions/git-sync-commit
        with:
          target_dir: "/tmp/openlab-configs"
          commit_msg: "chore(nodes): ${{ inputs.action }} node ${{ inputs.hostname }}"
          author_name: "ci-bot"
          author_email: "ci-bot@lab"
          branch: "main"

      - name: 推送至 Operations 倉庫
        uses: ./.gitea/actions/git-sync-commit
        with:
          target_dir: "/tmp/openlab-operations"
          commit_msg: "chore(nodes): ${{ inputs.action }} node ${{ inputs.hostname }}"
          author_name: "ci-bot"
          author_email: "ci-bot@lab"
          branch: "main"
