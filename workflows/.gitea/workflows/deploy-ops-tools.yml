name: Deploy Operations Tools Workflow

on:
  workflow_dispatch:
    inputs:
      target_hosts:
        description: 'Target Host(s) or Group (e.g., dev, servers, all)'
        required: true
        default: 'dev'

jobs:
  deploy-ops-tools:
    runs-on: ansible
    defaults:
      run:
        shell: sh

    steps:
      - name: 檢出工作流倉庫 (Self Checkout)
        run: |
          git clone --quiet --depth 1 http://oauth2:${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}@${{ vars.GIT_HOST || 'gitea.lab' }}/${{ vars.ORG_NAME || 'OpenLabOps' }}/openlab-workflows.git .

      - name: 執行 Ansible 劇本 (Deploy Operations Tools)
        uses: ./.gitea/actions/execute-homelab-playbook
        with:
          playbook: 'playbooks/deploy-ops-tools.yml'
          target_hosts: ${{ inputs.target_hosts }}
          need_tools: 'true'
          key_name: 'ansible.key'
          gitea_host: ${{ vars.GIT_HOST || 'gitea.lab' }}
          org_name: ${{ vars.ORG_NAME || 'OpenLabOps' }}
          token: ${{ secrets.MASTER_TOKEN || secrets.BOT_TOKEN }}
