name: "Execute Homelab Ansible Playbook"
description: "Turnkey one-step action that prepares runner, clones federation repos, injects SSH credentials, and executes Ansible playbook"
inputs:
  playbook:
    description: "Relative path to the playbook (e.g. playbooks/deploy-openlab-tools.yml)"
    required: true
  target_hosts:
    description: "Target host or group (injected as target_hosts)"
    required: false
    default: ""
  extra_vars:
    description: "Additional extra variables string"
    required: false
    default: ""
  tags:
    description: "Tags to run"
    required: false
    default: ""
  skip_tags:
    description: "Tags to skip"
    required: false
    default: ""
  key_name:
    description: "SSH private key filename in openlab-secrets/ssh-key/"
    required: false
    default: "ansible.key"
  source_commit_sha:
    description: "Optional historical Git commit SHA in openlab-secrets to extract previous private key for unlocking nodes"
    required: false
    default: ""
  need_tools:
    description: "Whether openlab-tools is needed (true/false)"
    required: false
    default: "false"
  need_configs:
    description: "Whether openlab-configs is needed (true/false)"
    required: false
    default: "false"
  gitea_host:
    description: "Gitea hostname"
    required: false
    default: "gitea.lab"
  gitea_port:
    description: "Gitea port"
    required: false
    default: ""
  gitea_proto:
    description: "Gitea protocol"
    required: false
    default: "http"
  org_name:
    description: "Organization name"
    required: false
    default: "OpenLabOps"
  repo_prefix:
    description: "Repository prefix (e.g. openlab, homelab, openlab)"
    required: false
    default: "openlab"
  token:
    description: "OAuth2 authentication token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Prepare Runner & SSH Environment
      shell: sh
      run: |
        echo "🔧 [Action: execute-homelab-playbook] Initializing environment..."
        if ! command -v git >/dev/null 2>&1 || ! command -v ssh >/dev/null 2>&1 || ! command -v ansible-playbook >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apk add --no-cache git openssh-client ansible rsync python3
            elif command -v sudo >/dev/null 2>&1; then
              sudo apk add --no-cache git openssh-client ansible rsync python3
            fi
          fi
        fi
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf "Host *\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n" > ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Clone Federation Repositories
      shell: sh
      env:
        HOST: ${{ inputs.gitea_host }}
        PORT: ${{ inputs.gitea_port }}
        PROTO: ${{ inputs.gitea_proto }}
        ORG: ${{ inputs.org_name }}
        PREFIX: ${{ inputs.repo_prefix }}
        TOKEN: ${{ inputs.token }}
        NEED_TOOLS: ${{ inputs.need_tools }}
        NEED_CONFIGS: ${{ inputs.need_configs }}
      run: |

        PORT_STR=""
        if [ -n "$PORT" ] && [ "$PORT" != "80" ] && [ "$PORT" != "443" ]; then
          PORT_STR=":${PORT}"
        fi

        SUFFIXES="ansible secrets"
        if [ "$NEED_TOOLS" = "true" ]; then
          SUFFIXES="$SUFFIXES tools"
        fi
        if [ "$NEED_CONFIGS" = "true" ]; then
          SUFFIXES="$SUFFIXES configs"
        fi

        mkdir -p /tmp
        echo "📦 [Action: execute-homelab-playbook] Fetching repos (prefix: ${PREFIX})..."
        OPS_DIR="/tmp/${PREFIX}-operations"
        for sfx in $SUFFIXES; do
          TARGET="/tmp/homelab-${sfx}"
          if [ ! -d "$TARGET/.git" ] && [ ! -d "$TARGET" ]; then
            if git clone --quiet --depth 1 "${PROTO}://oauth2:${TOKEN}@${HOST}${PORT_STR}/${ORG}/${PREFIX}-${sfx}.git" "$TARGET" 2>/dev/null; then
              :
            elif [ "$sfx" = "ansible" ] || [ "$sfx" = "tools" ]; then
              if [ ! -d "$OPS_DIR/.git" ]; then
                git clone --quiet --depth 1 "${PROTO}://oauth2:${TOKEN}@${HOST}${PORT_STR}/${ORG}/${PREFIX}-operations.git" "$OPS_DIR" 2>/dev/null || true
              fi
              if [ -d "$OPS_DIR/$sfx" ]; then
                ln -sfn "$OPS_DIR/$sfx" "$TARGET"
              else
                git clone --quiet --depth 1 "${PROTO}://oauth2:${TOKEN}@${HOST}${PORT_STR}/${ORG}/homelab-${sfx}.git" "$TARGET"
              fi
            else
              git clone --quiet --depth 1 "${PROTO}://oauth2:${TOKEN}@${HOST}${PORT_STR}/${ORG}/homelab-${sfx}.git" "$TARGET"
            fi
          fi
          if [ "$PREFIX" != "homelab" ] && [ ! -e "/tmp/${PREFIX}-${sfx}" ]; then
            ln -s "$TARGET" "/tmp/${PREFIX}-${sfx}"
          fi
        done

    - name: Setup SSH Authentication Key
      shell: sh
      env:
        KEY: ${{ inputs.key_name }}
        SOURCE_SHA: ${{ inputs.source_commit_sha }}
      run: |
        SRC="/tmp/openlab-secrets/ssh-key/${KEY}"
        DEST="${HOME}/.ssh/${KEY}"
        if [ -f "$SRC" ]; then
          cp -f "$SRC" "$DEST"
          chmod 600 "$DEST"
          if [ -n "$SOURCE_SHA" ] && [ "$SOURCE_SHA" != "HEAD" ]; then
            git -C /tmp/openlab-secrets fetch --quiet --unshallow 2>/dev/null || true
            if git -C /tmp/openlab-secrets show "${SOURCE_SHA}:ssh-key/${KEY}" > "${DEST}.historical" 2>/dev/null; then
              chmod 600 "${DEST}.historical"
              cp -f "${DEST}" "${DEST}.latest"
              chmod 600 "${DEST}.latest"
              cp -f "${DEST}.historical" "${DEST}"
              chmod 600 "${DEST}"
              printf "  IdentityFile %s\n  IdentityFile %s\n" "${DEST}" "${DEST}.latest" >> ~/.ssh/config
              echo "🔑 [Action: execute-homelab-playbook] Historical SSH key ${KEY} @ ${SOURCE_SHA} loaded for door-opening."
            fi
          fi
          echo "🔑 [Action: execute-homelab-playbook] SSH key ${KEY} configured successfully."
        else
          echo "❌ [Action: execute-homelab-playbook] Error: Key ${SRC} not found!"
          exit 1
        fi

    - name: Execute Ansible Playbook
      shell: sh
      env:
        PLAYBOOK: ${{ inputs.playbook }}
        TARGET_HOSTS: ${{ inputs.target_hosts }}
        EXTRA_VARS: ${{ inputs.extra_vars }}
        TAGS: ${{ inputs.tags }}
        SKIP_TAGS: ${{ inputs.skip_tags }}
      run: |

        cd /tmp/openlab-ansible
        export ANSIBLE_HOST_KEY_CHECKING="False"

        set -- -i inventory/hosts.yml "$PLAYBOOK"
        if [ -n "$TARGET_HOSTS" ]; then
          set -- "$@" --extra-vars "target_hosts=$TARGET_HOSTS"
        fi
        if [ -n "$EXTRA_VARS" ]; then
          set -- "$@" --extra-vars "$EXTRA_VARS"
        fi
        if [ -n "$TAGS" ]; then
          set -- "$@" --tags "$TAGS"
        fi
        if [ -n "$SKIP_TAGS" ]; then
          set -- "$@" --skip-tags "$SKIP_TAGS"
        fi

        echo "🚀 [Action: execute-homelab-playbook] Running: ansible-playbook $*"
        ansible-playbook "$@"
