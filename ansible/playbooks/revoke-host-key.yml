---
# ==============================================================================
# Playbook: Revoke Endpoint SSH Public Key ($hostname.pub) from Target Servers
# Target Hosts: servers (or override via --extra-vars "target_hosts=...")
# Target User: labadmin (strictly separate from lab automation user)
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/revoke-host-key.yml \
#     --extra-vars "host_name=workstation"
# ==============================================================================
- name: Revoke Endpoint SSH Public Key ($hostname.pub) from Target Servers
  hosts: "{{ target_hosts | default('servers') }}"

  gather_facts: false

  vars:
    endpoint_name: "{{ host_name | mandatory }}"
    target_account: "{{ target_user | default('labadmin') }}"

  tasks:
    - name: 依優先順序探測公鑰檔案 (傳入變數 -> ~/.ssh/ -> CI runner -> 本地 secrets repo)
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      loop:
        - "{{ host_pub_key_path | default('/nonexistent') }}"
        - "{{ lookup('env', 'HOME') + '/.ssh/' + endpoint_name + '.pub' }}"
        - "/tmp/openlab-secrets/ssh-key/{{ endpoint_name }}.pub"
        - "{{ lookup('env', 'HOME') + '/openlab-secrets/ssh-key/' + endpoint_name + '.pub' }}"
      register: pub_candidates

    - name: 確定端點公鑰檔案路徑
      ansible.builtin.set_fact:
        resolved_pub_path: "{{ (pub_candidates.results | selectattr('stat.exists') | map(attribute='item') | first) | default('') }}"

    - name: 讀取端點公鑰內容 (若公鑰檔案存在)
      ansible.builtin.slurp:
        src: "{{ resolved_pub_path }}"
      delegate_to: localhost
      register: host_pub_content
      when: resolved_pub_path != ''

    - name: 從 authorized_keys 移除該端點公鑰 (透過公鑰內容比對)
      ansible.posix.authorized_key:
        user: "{{ target_account }}"
        key: "{{ host_pub_content.content | b64decode | trim }}"
        state: absent
      when: resolved_pub_path != '' and (host_pub_content.content is defined)
      become: true
      register: revoke_by_key_res

    - name: 雙重防護：清除任何帶有 {{ endpoint_name }}-client 註解之公鑰條目
      ansible.builtin.lineinfile:
        path: "~{{ target_account }}/.ssh/authorized_keys"
        regexp: '.*[#\s]+{{ endpoint_name }}-client(\s.*)?$'
        state: absent
      become: true
      register: revoke_by_comment_res

    - name: 顯示清除結果
      ansible.builtin.debug:
        msg: >-
          Host {{ inventory_hostname }} ({{ ansible_host }}):
          {{ 'Revoked ' + endpoint_name + ' key from ' + target_account if ((revoke_by_key_res is defined and revoke_by_key_res.changed) or (revoke_by_comment_res is defined and revoke_by_comment_res.changed)) else endpoint_name + ' key not found (already clean)' }}
