---
# ==============================================================================
# 全域通用變數 (Global Group Vars for All Hosts)
# Auto-generated by openlabops from manifest
# ==============================================================================
ansible_user: ansible
admin_user: labadmin
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ansible.key"

# 規範中性金鑰網段存取限制 (Canonical Key Network Constraints)
ansible_key_options: 'from="192.168.1.0/24"'
user_key_options: 'from="192.168.1.0/24"'
endpoint_key_options: ""



# 叢集網段定義與允許來源
cluster_subnets:
  - "192.168.1.0/24"
allowed_ssh_cidrs: "192.168.1.0/24"


# 時區與語系設定
global_timezone: "UTC"
global_locale: "en_US.UTF-8"

# 基礎套件清單
common_packages:
  - curl
  - wget
  - git
  - rsync
  - htop
  - vim
