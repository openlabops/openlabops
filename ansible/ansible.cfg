[defaults]
inventory = inventory/hosts.yml
library = library
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 20
# callbacks_enabled = timer, profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o Compression=yes

